name: cardiac-prism
services:
  workstation:
    image: cardiac-prism:0.1.2-cpu
    build:
      context: .
      args:
        TORCH_VARIANT: cpu
    init: true
    restart: unless-stopped
    user: "${CARDIAC_PRISM_UID:-${KPRISM_UID:-1000}}:${CARDIAC_PRISM_GID:-${KPRISM_GID:-1000}}"
    ports:
      - "${CARDIAC_PRISM_BIND:-${KPRISM_BIND:-127.0.0.1}}:${CARDIAC_PRISM_PORT:-${KPRISM_PORT:-8502}}:8502"
    environment:
      CARDIAC_PRISM_DEVICE: cpu
      CARDIAC_PRISM_CPU_THREADS: "${CARDIAC_PRISM_CPU_THREADS:-${KPRISM_CPU_THREADS:-2}}"
      CARDIAC_PRISM_PRELOAD: "${CARDIAC_PRISM_PRELOAD:-${KPRISM_PRELOAD:-0}}"
      CARDIAC_PRISM_GZIP_LEVEL: "1"
    volumes:
      - ./workspace:/data/workspace
      - ./weight:/app/weight:ro
      - ./demo-data:/app/demo-data:ro
    shm_size: 1gb
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

