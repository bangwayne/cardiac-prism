# This standalone override exposes all GPUs. Use scripts/docker.sh for GPU subsets.
services:
  workstation:
    image: cardiac-prism:0.1.1-cuda11.7
    build:
      args:
        TORCH_VARIANT: cu117
    environment:
      CARDIAC_PRISM_DEVICE: "${CARDIAC_PRISM_DEVICE:-${KPRISM_DEVICE:-cuda:0}}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

