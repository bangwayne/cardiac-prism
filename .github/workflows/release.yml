name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: models/${{ github.ref_name }}
          path: model-assets
          lfs: true
          persist-credentials: false
      - name: Assemble verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          manifest = json.loads(pathlib.Path('assets/manifest.json').read_text())
          assert manifest['release'] == os.environ['RELEASE_TAG']
          output = pathlib.Path('release-assets'); output.mkdir()
          for entry in manifest['assets']:
              if entry['group'] != 'weights': continue
              path = pathlib.Path('model-assets') / entry['path']
              assert path.stat().st_size == entry['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256']
              shutil.copyfile(path, output / path.name)
              profile = pathlib.Path(entry['profile'])
              assert json.loads(profile.read_text())['checkpoint_sha256'] == entry['sha256']
              shutil.copyfile(profile, output / profile.name)
          for source in ['LICENSE', 'NOTICE', 'docs/model-card.md', 'assets/manifest.json']:
              shutil.copyfile(source, output / pathlib.Path(source).name)
          (output / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n'
              for p in sorted(output.iterdir())))
          PY
      - name: Publish the repository release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
            --title "Cardiac Prism $RELEASE_TAG" --notes-file CHANGELOG.md
          gh release view "$RELEASE_TAG" --json url,assets --jq '{url, assets: [.assets[].name]}'
      - name: Record successful publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          gh_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          git tag -a "published/$RELEASE_TAG" -m "Verified release assets published at $gh_url" "$GITHUB_SHA"
          git push origin "refs/tags/published/$RELEASE_TAG"
