name: Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      source_ref:
        description: Source revision to validate
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  contribution-policy:
    name: Contribution policy
    runs-on: ubuntu-22.04
    steps:
      - name: Check pull request destination
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" || "$BASE_BRANCH" == "develop" ]]; then
            exit 0
          fi
          if [[ "$BASE_BRANCH" == "main" && "$PR_AUTHOR" == "bangwayne" && "$HEAD_REPOSITORY" == "bangwayne/cardiac-prism" ]]; then
            exit 0
          fi
          echo "::error::Community pull requests must target develop. Only the maintainer promotes changes to main."
          exit 1
  workstation:
    needs: contribution-policy
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10.14'
      - name: Install the CPU development environment
        id: install
        run: |
          set -euo pipefail
          mkdir -p test-results/ci
          ./scripts/setup.sh --device cpu --dev --skip-assets 2>&1 | tee test-results/ci/setup.log
      - name: Backend tests
        id: backend
        run: |
          set -euo pipefail
          ./scripts/test.sh 2>&1 | tee test-results/ci/backend.log
      - name: Browser tests
        id: browser
        run: |
          set -euo pipefail
          export PATH="$PWD/runtime/node/bin:$PATH"
          export CARDIAC_PRISM_TEST_PYTHON="$PWD/.venv/bin/python"
          cd frontend
          npx playwright install --with-deps chromium 2>&1 | tee ../test-results/ci/playwright-install.log
          npm test 2>&1 | tee ../test-results/ci/browser.log
      - name: Summarize validation
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = ["## Validation results", "", "| Stage | Result |", "| --- | --- |"]
          for label, variable in (("Environment installation", "INSTALL_OUTCOME"),
                                  ("Backend tests", "BACKEND_OUTCOME"),
                                  ("Browser tests", "BROWSER_OUTCOME")):
              lines.append(f"| {label} | {os.environ[variable] or 'not run'} |")
          for path in sorted(Path("test-results").glob("browser-*/summary.json")):
              try:
                  report = json.loads(path.read_text())
              except (OSError, ValueError) as error:
                  lines.extend(["", f"Could not read browser summary: {type(error).__name__}."])
                  continue
              tests = report.get("tests", [])
              passed = sum(bool(test.get("passed")) for test in tests)
              lines.extend(["", f"Browser suites passed: **{passed}**."])
              failed = next((test for test in tests if not test.get("passed")), None)
              if failed:
                  lines.append(f"First failed browser suite: **{failed['script']}**.")
              if report.get("failure"):
                  message = report["failure"].splitlines()[0][:1000].replace("```", "'''")
                  lines.extend(["", "```text", message, "```"])
          lines.extend(["", "Download the **test-diagnostics** artifact for full step logs, browser reports and synthetic screenshots.",
                        "Expected error-path test messages may appear in backend logs; the stage result above reflects the test exit status.", ""])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(lines))
          PY
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results/ci/*.log
            test-results/browser-*/**/*.log
            test-results/browser-*/**/*.json
            test-results/browser-*/**/*.png
            !test-results/**/workspace/**
            !test-results/**/fixtures/**
            !test-results/**/priors/**

