name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Source revision to validate
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  workstation:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.14'
      - name: Install the CPU development environment
        run: ./scripts/setup.sh --device cpu --dev --skip-assets
      - name: Backend tests
        run: ./scripts/test.sh
      - name: Browser tests
        run: |
          export PATH="$PWD/runtime/node/bin:$PATH"
          export CARDIAC_PRISM_TEST_PYTHON="$PWD/.venv/bin/python"
          cd frontend
          npx playwright install --with-deps chromium
          npm test

